[package]
name = "jarvis-tauri"
version = "0.1.0"
description = "My Athena V1 - Tauri"
authors = ["you"]
edition = "2021"

[lib]
name = "jarvis_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.2"
screenshots = "0.8"
image = "0.24"
base64 = "0.22"
dirs = "5"
